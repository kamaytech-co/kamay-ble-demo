; Kamay BLE Demo
; Periferico BLE que expone temperatura, humedad y bateria (GATT estandar)
; para la demo Web Bluetooth de https://kamaytech.com.co/lab/
;
; Compilar:        pio run
; Flashear:        pio run -t upload            (usa default_envs)
;                  pio run -e esp32-c3-devkitm-1 -t upload
;                  pio run -e esp32-c6-devkitc-1 -t upload
; Monitor serie:   pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = platformio/espressif32@7.0.1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DKAMAY_FW_VERSION=\"0.2.1\"
    -DKAMAY_SENSOR=AUTO
    -DKAMAY_BAT_FIXED=100
    -DKAMAY_BOARD=\"$PIOENV\"
    ; Solo rol periferico: recorta flash y RAM del stack NimBLE.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Opciones (agrega a build_flags del env que uses):
;   -DKAMAY_SENSOR=SYNTH | INTERNAL | DHT22 | SHT31   (AUTO = INTERNAL si el chip
;                                                     tiene sensor de die, si no SYNTH)
;   -DKAMAY_DHT_PIN=4                                 pin de datos del DHT22
;   -DKAMAY_SHT31_ADDR=0x44                           direccion I2C del SHT31
;   -DKAMAY_BAT_ADC_PIN=34                            activa lectura por ADC (divisor 2:1)
;   -DKAMAY_BAT_DIVIDER=2.0                           relacion del divisor (Vbat / Vadc)

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; ESP32-C6: la plataforma oficial trae Arduino 2.x, que no soporta el C6.
; pioarduino trae Arduino 3.3.12 (ESP-IDF 5.5.5).
[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
